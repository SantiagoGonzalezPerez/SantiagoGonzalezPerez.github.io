---
layout: default
---

<style>
  .post-header h1 {
    font-family: "Red Hat Text", sans-serif;
    font-size: 2.5rem;
  }

  .post-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .post-content {
    max-width: 960px;
    margin: 2rem auto;
    font-family: "Red Hat Text", sans-serif;
    font-size: 1.2rem;
    color: black;
  }
</style>

<article class="post">
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <!--<div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d-%B-%Y" }}</time>
    </div>-->
  </div>
  <div class="post-content">{{ content }}</div>
</article>
